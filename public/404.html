<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found — Gender Predictor</title>
<meta name="description" content="Page not found. Head back to the free Chinese gender predictor tool with 9 methods combined.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #faf9f7; --accent: #7b6b9a; --accent-subtle: #f3f1f7;
    --sage-light: #e8f0eb; --text: #2d2933; --text-muted: #6b6672;
    --border: #e8e5ec; --boy: #8ba6c8; --girl: #c8848f;
    --radius: 12px; --radius-lg: 16px;
    --shadow: 0 2px 8px rgba(45,41,51,.12), 0 1px 2px rgba(45,41,51,.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--base); color: var(--text); line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  h1, .code { font-family: 'Outfit', system-ui, sans-serif; }
  .card {
    max-width: 460px; width: 100%; background: #fff;
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 48px 32px;
  }
  .code {
    font-size: 72px; font-weight: 800; line-height: 1;
    background: linear-gradient(90deg, var(--boy), var(--girl));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 24px; font-weight: 800; margin: 16px 0 8px; }
  p { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; }
  .btn {
    display: inline-block; background: var(--accent); color: #fff;
    text-decoration: none; font-weight: 600; font-size: 15px;
    padding: 12px 28px; border-radius: var(--radius); margin-bottom: 20px;
  }
  .btn:hover { background: #6a5b88; }
  .links { font-size: 14px; color: var(--text-muted); }
  .links a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .links a:hover { text-decoration: underline; }
  .dot { margin: 0 10px; color: var(--border); }
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to predicting.</p>
    <a class="btn" href="/">Go to Gender Predictor</a>
    <p class="links"><a href="/chinese-gender-chart/">Chinese Gender Chart</a><span class="dot">·</span><a href="/blog/">Blog</a></p>
  </main>
</body>
</html>
